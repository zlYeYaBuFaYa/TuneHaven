const cover=(name,cls='cover')=>`<img class="${cls}" src="assets/${name}.svg" alt="${{dusk:'日落之前',coast:'沿着海岸线','coast-disc':'沿着海岸线',moon:'Blue Hour',field:'Soft Landing'}[name]} 概念专辑封面">`;
function status(){return `<div class="status"><span>9:41</span><div class="island"></div><div class="signals">${icon('signal')}${icon('wifi')}${icon('battery','battery')}</div></div>`}
function tabs(selected){return `<nav class="tabs" aria-label="主导航">${[['library','音乐库'],['playlist','歌单'],['settings','设置']].map(([name,label])=>`<button class="tab ${selected===name?'selected':''}" aria-label="${label}" ${selected===name?'aria-current="page"':''} data-toast="${label} · 概念页面">${icon(name)}<span>${label}</span></button>`).join('')}</nav>`}
function mini(art='dusk',song='日落之前',artist='岛屿来信'){return `<div class="mini">${cover(art)}<div class="song-text"><strong>${song}</strong><small>${artist}</small></div><button aria-label="暂停" data-toggle-play>${icon('pause')}</button><button aria-label="下一首" data-toast="已切换下一首 · 演示">${icon('next')}</button></div>`}
function chrome(tab,art,song,artist){return `<div class="bottom">${mini(art,song,artist)}${tabs(tab)}</div><div class="homebar"></div>`}
function wave(){return '<span class="wave" aria-label="正在播放"><i></i><i></i><i></i><i></i></span>'}
function row(art,title,artist,active=false,detail=''){return `<div class="song-row" data-title="${title.toLowerCase()}">${cover(art)}<div class="song-text"><strong>${title}</strong><small>${artist}${detail?' · '+detail:''}</small></div>${active?wave():''}<button class="more" aria-label="${title}的更多选项" data-toast="${title} · 更多选项">${icon('more')}</button></div>`}
function search(text='搜索歌曲、艺术家、专辑'){return `<label class="search">${icon('search')}<span class="sr-only">${text}</span><input placeholder="${text}" aria-label="${text}"></label>`}
function segments(labels,selected=0){return `<div class="segments" role="tablist">${labels.map((s,i)=>`<button role="tab" aria-selected="${i===selected}" class="${i===selected?'active':''}">${s}</button>`).join('')}</div>`}
function libraryA(){return `${status()}<div class="content"><div class="title-row"><div><div class="tiny-label">YOUR MUSIC, AT HOME.</div><h2>音乐库</h2></div><button class="circle-btn" aria-label="导入音乐" data-toast="导入音乐 · 文件 / Wi-Fi / WebDAV">${icon('plus')}</button></div>${search()}${segments(['全部','艺术家','专辑'])}<div class="hero"><div class="hero-copy"><div class="overline">PICK UP WHERE YOU LEFT OFF</div><h3>接着，听一会儿。</h3><p>上次听到「日落之前」</p><button class="pill-action" data-toggle-play>${icon('play')}继续播放</button></div><div class="record"></div></div><div class="section-heading"><h3>所有歌曲 <span style="font-size:11px;font-weight:400;color:var(--muted);margin-left:6px">128</span></h3><button data-toast="按最近添加排序">最近添加 ${icon('sort')}</button></div>${row('dusk','日落之前','岛屿来信',true)}${row('field','Soft Landing','Luna Field')}${row('coast','沿着海岸线','白昼漫游')}</div>${chrome('library')}`}
function libraryB(){return `${status()}<div class="content"><div class="title-row"><div><div class="tiny-label">A PLACE FOR EVERY MOOD.</div><h2>歌单</h2></div><button class="circle-btn" aria-label="新建歌单" data-toast="新建歌单 · 演示">${icon('plus')}</button></div>${search('搜索你的歌单')}
<div class="folder-grid"><button class="folder-card" data-toast="我喜欢 · 36 首歌曲"><div class="folder-icon">${icon('heart')}</div><strong>我喜欢</strong><small>36 首珍藏</small></button><button class="folder-card" data-toast="最近播放 · 24 首歌曲"><div class="folder-icon">${icon('clock')}</div><strong>最近播放</strong><small>24 首回响</small></button></div><div class="section-heading"><h3>我的歌单</h3><button data-toast="管理歌单分组">${icon('folder')}分组</button></div><div class="hero" style="margin:4px 0 14px"><div class="hero-copy"><div class="overline">SLOW DAYS COLLECTION</div><h3>把日子调慢</h3><p>18 首 · 1 小时 12 分钟</p><button class="pill-action" data-toggle-play>${icon('play')}播放歌单</button></div><div class="record"></div></div><div class="playlist-list">${row('coast','去海边的路上','12 首歌曲')}${row('field','一个人的下午','21 首歌曲')}</div></div>${chrome('playlist','coast','沿着海岸线','白昼漫游')}`}
function libraryC(){return `${status()}<div class="content"><div class="title-row"><div><div class="tiny-label">COLLECTED, NOT STREAMED.</div><h2>音乐库</h2></div><button class="circle-btn" aria-label="导入音乐" data-toast="导入音乐 · 文件 / Wi-Fi / WebDAV">${icon('plus')}</button></div>${search()}${segments(['全部歌曲','艺术家','专辑'],2)}<div class="section-heading"><h3>最近收藏</h3><button data-toast="查看全部专辑">全部 ${icon('right')}</button></div><div class="album-pair"><div class="album-item">${cover('moon','')}<strong>Blue Hour</strong><small>北纬三十度 · 8 首</small></div><div class="album-item">${cover('dusk','')}<strong>日落之前</strong><small>岛屿来信 · 12 首</small></div></div><div class="section-heading"><h3>最近播放</h3><button data-toast="查看播放历史">查看全部 ${icon('right')}</button></div>${row('moon','Blue Hour','北纬三十度',true)}${row('field','Soft Landing','Luna Field')}${row('coast','沿着海岸线','白昼漫游')}</div>${chrome('library','moon','Blue Hour','北纬三十度')}`}
function playerHead(title='日落之前'){return `<div class="player-head"><button aria-label="收起播放器" data-toast="收起播放器 · 演示">${icon('down')}</button><div class="center"><small>PLAYING FROM YOUR LIBRARY</small><strong>${title}</strong></div><button aria-label="更多播放选项" data-toast="倍速 · 定时关闭 · 歌词 · 更多">${icon('more')}</button></div>`}
function progress(){return '<div class="progress"><div class="track" role="progressbar" aria-label="播放进度" aria-valuenow="38" aria-valuemin="0" aria-valuemax="100"><i></i></div><div class="time"><span>01:28</span><span>−02:24</span></div></div>'}
function controls(){return `<div class="play-controls"><button class="small" aria-label="随机播放" data-toast="已开启随机播放">${icon('shuffle')}</button><button aria-label="上一首" data-toast="已切换上一首 · 演示">${icon('prev')}</button><button class="main-play" aria-label="暂停" data-toggle-play>${icon('pause')}</button><button aria-label="下一首" data-toast="已切换下一首 · 演示">${icon('next')}</button><button class="small" aria-label="播放队列" data-toast="播放队列 · 18 首歌曲">${icon('queue')}</button></div>`}
function player(variant){const b=variant==='b',art=b?'coast-disc':'dusk',song=b?'沿着海岸线':'日落之前',artist=b?'白昼漫游':'岛屿来信';return `${status()}${playerHead(b?'把日子调慢':'日落之前')}<div class="art-frame">${cover(art,'')}</div><div class="player-info"><div><h2>${song}</h2><p>${artist} / ${b?'向海而生':'温柔的回声'}</p></div><button class="heart-btn" aria-label="收藏歌曲" aria-pressed="false" data-heart>${icon('heart')}</button></div><div class="quality"><span class="badge">LOSSLESS</span><span class="badge">24-BIT / 48 kHz</span></div><button class="lyrics-link" style="width:calc(100% - 58px);background:${b?'':'transparent'}" data-toast="打开完整歌词 · 演示"><span>${b?'「让风，带我们去更远的地方」':'「把这一刻，留给缓慢的晚风」'}</span>${icon('right')}</button>${progress()}${controls()}<div class="player-foot">${icon('airplay')}AirPods Pro ${icon('down')}</div><div class="homebar"></div>`}
function lyricPlayer(){return `${status()}${playerHead('Blue Hour')}<div class="lyric-song">${cover('moon')}<div class="song-text"><strong>Blue Hour</strong><small>北纬三十度</small></div><button class="heart-btn" aria-label="收藏歌曲" aria-pressed="false" data-heart>${icon('heart')}</button></div><div class="lyric-stage"><p class="past">当城市慢慢安静</p><p class="past">让所有喧嚣远去</p><div class="current"><span>在蓝色的时间里</span><span>只听见你</span></div><p>夜色轻轻落在肩上</p><p>我们不急着去远方</p></div><div class="lyric-tools"><button data-toast="歌词字号已调整">字 Aᴀ</button><button data-toast="已切换繁体歌词">简 / 繁</button><button data-toast="歌词已对齐当前进度">歌词同步</button></div>${progress()}${controls()}<div class="player-foot">${icon('airplay')}AirPods Pro ${icon('down')}</div><div class="homebar"></div>`}
const concepts=[{id:'a',no:'01',name:'云霞',en:'Soft Reverie',eyebrow:'ROSE × POWDER BLUE',thesis:'把喜欢的声音，<br>轻轻收藏。',detail:'粉色与雾蓝在留白中相遇。唱片与封面成为视觉中心，黑色播放键为柔和界面留下清晰的落点。',layout:'音乐库 + 播放器',signature:'柔光唱片 · 悬浮底栏',colors:['#F1CCE3','#C9E4F6','#DDD5F5','#F9F7FB','#222128'],labels:['音乐库','正在播放'],screens:[libraryA,()=>player('a')]},{id:'b',no:'02',name:'晴屿',en:'Quiet Grove',eyebrow:'MINT × WARM APRICOT',thesis:'每一种心情，<br>都有安放的地方。',detail:'薄荷绿与暖杏色铺出轻盈的收藏空间。把歌单做成可辨认的唱片夹，播放页像一张安静转动的唱片。',layout:'歌单 + 播放器',signature:'唱片夹 · 圆形封面',colors:['#BDE5D8','#FFE1BD','#DBEDDC','#F6FAF7','#243C34'],labels:['歌单收藏','正在播放'],screens:[libraryB,()=>player('b')]},{id:'c',no:'03',name:'月晕',en:'Blue Interlude',eyebrow:'ICE BLUE × PALE LILAC',thesis:'让视线安静，<br>让音乐靠近。',detail:'冰蓝与淡紫扩散成一片静谧。曲库回归专辑陈列，播放页把空间留给歌词，当前唱句以深色自然浮现。',layout:'专辑库 + 歌词播放器',signature:'专辑陈列 · 沉浸歌词',colors:['#C9DDF8','#DDD0FA','#D9E7FA','#F6F7FC','#2D344B'],labels:['音乐库 · 专辑','沉浸歌词'],screens:[libraryC,lyricPlayer]}];
const night=document.body.classList.contains('dark')||new URLSearchParams(location.search).get('mode')==='dark';
if(night){
document.body.classList.add('dark');
document.querySelector('.appearance-link').textContent='日间模式 ↗';
document.querySelector('.appearance-link').href='index.html';
const nightData=[
{en:'Afterglow',eyebrow:'DUSKY ROSE × SMOKY BLUE',thesis:'把夜色调暗，<br>把喜欢的声音留下。',detail:'玫瑰雾与蓝紫光沉入炭黑底色。浅粉播放键与烟色悬浮玻璃，让音乐在夜里依然有温度。',colors:['#512D48','#263A54','#3C3055','#16141E','#E4C5DB']},
{en:'Night Garden',eyebrow:'FOREST MINT × AMBER',thesis:'夜深了，<br>心情也有栖息地。',detail:'薄荷绿化作墨绿，暖杏色收成一束琥珀微光。收藏夹与唱片保留触感，让深夜的私人曲库温暖而有序。',colors:['#1B493C','#51422C','#233D33','#121C18','#C0DDC9']},
{en:'Midnight Interlude',eyebrow:'MIDNIGHT BLUE × VIOLET',thesis:'让夜色退后，<br>让这一句靠近。',detail:'午夜蓝与烟紫铺开安静的纵深。封面保留原本色彩，歌词用柔白聚焦当前唱句，听歌时视线自然停留。',colors:['#203E68','#3E315F','#293C61','#141B2C','#C6D0EE']}
];
concepts.forEach((c,i)=>Object.assign(c,nightData[i]));
}
document.getElementById('gallery').innerHTML=concepts.map(c=>`<section class="board ${c.id}" id="concept-${c.id}" aria-label="方案${c.no} ${c.name}"><div class="brand"><div class="brand-mark"><i></i><i></i><i></i></div>TuneHaven</div><div class="board-tag">${night?'DARK EDITION':'DESIGN EXPLORATION'} / ${c.no}</div><div class="intro"><div class="eyebrow">${c.eyebrow}</div><h1>${c.name}</h1><div class="en">${c.en}</div><div class="thesis">${c.thesis}</div><p class="detail">${c.detail}</p><div class="spec"><div><b>代表页面</b><p>${c.layout}</p></div><div><b>视觉记忆</b><p>${c.signature}</p></div></div><div class="swatches">${c.colors.map(color=>`<div class="swatch" style="background:${color}"><span>${color}</span></div>`).join('')}</div></div><div class="big-number">${c.no}</div>${c.screens.map((fn,i)=>`<div class="phone-wrap ${i?'second':'first'}"><div class="page-label"><span>${c.labels[i]}</span><span>${i?'02 / LISTEN':'01 / COLLECTION'}</span></div><div class="phone ${i?'player':''}"><div class="screen">${fn()}</div></div></div>`).join('')}<div class="board-footer"><span>LOCAL MUSIC. PERSONAL SPACE.</span><span>TUNEHAVEN · ${night?'NIGHT':'UI'} CONCEPT ${c.no} · 2026</span></div></section>`).join('');
const q=new URLSearchParams(location.search).get('concept');if(q&&['a','b','c'].includes(q)){document.body.classList.add('single');document.querySelector(`.board.${q}`).classList.add('visible')}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.matches('[data-toggle-play]')){const paused=btn.getAttribute('aria-label')==='播放';btn.setAttribute('aria-label',paused?'暂停':'播放');btn.innerHTML=icon(paused?'pause':'play');}if(btn.matches('[data-heart]')){const active=btn.getAttribute('aria-pressed')==='true';btn.setAttribute('aria-pressed',!active);btn.querySelector('svg').style.fill=active?'none':'currentColor';}if(btn.matches('[role=tab]')){btn.parentElement.querySelectorAll('button').forEach(x=>{x.classList.toggle('active',x===btn);x.setAttribute('aria-selected',x===btn)})}if(btn.dataset.toast){const screen=btn.closest('.screen');screen.querySelector('.toast')?.remove();const toast=document.createElement('div');toast.className='toast';toast.textContent=btn.dataset.toast;screen.append(toast);setTimeout(()=>toast.remove(),2000)}});
document.querySelectorAll('.search input').forEach(input=>input.addEventListener('input',()=>{const screen=input.closest('.screen');screen.querySelectorAll('.song-row').forEach(row=>row.style.display=row.dataset.title.includes(input.value.toLowerCase())?'':'none')}));
</script>
