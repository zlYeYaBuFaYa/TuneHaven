<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TuneHaven - Style B: Spotify 深色沉浸风</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; box-sizing: border-box; }
  body { margin: 0; background: #0a0a0a; overflow-x: hidden; }

  .phone-frame {
    width: 393px; height: 852px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 3px #333, 0 0 0 6px #1a1a1a, 0 25px 80px rgba(0,0,0,0.6);
  }

  .player-bg {
    background: linear-gradient(165deg, #1a3a2a 0%, #0d1f17 35%, #0a0f0c 70%, #080808 100%);
  }

  .cover-glow {
    filter: blur(80px);
    opacity: 0.35;
    transform: scale(1.4);
  }

  .progress-track { background: rgba(255,255,255,0.15); border-radius: 3px; height: 4px; cursor: pointer; }
  .progress-track:hover { height: 6px; }
  .progress-fill { background: #1DB954; border-radius: 3px; height: 100%; width: 35%; position: relative; transition: height 0.15s; }
  .progress-fill::after {
    content: ''; width: 14px; height: 14px; border-radius: 50%; background: #fff;
    position: absolute; right: -7px; top: 50%; transform: translateY(-50%);
    opacity: 0; transition: opacity 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .progress-track:hover .progress-fill::after { opacity: 1; }

  .control-btn { transition: transform 0.1s, opacity 0.15s; cursor: pointer; }
  .control-btn:hover { opacity: 0.8; }
  .control-btn:active { transform: scale(0.92); }

  .play-btn {
    width: 64px; height: 64px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.15s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .play-btn:hover { transform: scale(1.06); }
  .play-btn:active { transform: scale(0.95); }

  .lyrics-line { transition: all 0.3s ease; cursor: pointer; }
  .lyrics-line:hover { color: rgba(255,255,255,0.7); }

  .action-chip {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 6px 16px;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .action-chip:hover { background: rgba(255,255,255,0.14); }

  .tab-active {
    background: rgba(29,185,84,0.15);
    color: #1DB954;
    border-bottom: 2px solid #1DB954;
  }

  .song-row {
    transition: background 0.15s;
    border-radius: 8px;
    cursor: pointer;
  }
  .song-row:hover { background: rgba(255,255,255,0.06); }

  .mini-player {
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(24,24,24,0.92);
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .tab-bar {
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(10,10,10,0.88);
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  @keyframes pulse-wave { 0%,100%{opacity:0.4} 50%{opacity:1} }
  .wave-bar { animation: pulse-wave 1.2s ease-in-out infinite; }
  .wave-bar:nth-child(2) { animation-delay: 0.15s; }
  .wave-bar:nth-child(3) { animation-delay: 0.3s; }
  .wave-bar:nth-child(4) { animation-delay: 0.45s; }
</style>
</head>
