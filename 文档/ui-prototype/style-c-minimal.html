<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TuneHaven - Style C: 极简纯净风</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap');
  * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; box-sizing: border-box; }
  body { margin: 0; background: #f0eeeb; overflow-x: hidden; }

  .phone-frame {
    width: 393px; height: 852px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 3px #d4d0ca, 0 0 0 6px #e8e5e0, 0 25px 80px rgba(0,0,0,0.1);
  }

  .control-btn { transition: transform 0.12s, opacity 0.15s; cursor: pointer; }
  .control-btn:hover { opacity: 0.6; }
  .control-btn:active { transform: scale(0.9); }

  .play-btn {
    width: 72px; height: 72px; border-radius: 50%;
    background: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.2s;
  }
  .play-btn:hover { transform: scale(1.04); box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
  .play-btn:active { transform: scale(0.95); }

  .progress-track {
    background: #e0ddd8;
    border-radius: 2px;
    height: 3px;
    cursor: pointer;
    transition: height 0.15s;
  }
  .progress-track:hover { height: 5px; }
  .progress-fill {
    background: #1a1a1a;
    border-radius: 2px;
    height: 100%;
    width: 35%;
    position: relative;
  }
  .progress-fill::after {
    content: ''; width: 12px; height: 12px; border-radius: 50%;
    background: #1a1a1a;
    position: absolute; right: -6px; top: 50%; transform: translateY(-50%);
    opacity: 0; transition: opacity 0.2s;
  }
  .progress-track:hover .progress-fill::after { opacity: 1; }

  .song-row {
    transition: background 0.15s;
    border-radius: 12px;
    cursor: pointer;
  }
  .song-row:hover { background: rgba(0,0,0,0.03); }

  .tab-indicator {
    width: 4px; height: 4px; border-radius: 50%;
    background: #1a1a1a;
  }

  .tag {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid #d4d0ca;
    color: #8a8580;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tag:hover { border-color: #1a1a1a; color: #1a1a1a; }
  .tag-active {
    background: #1a1a1a;
    border-color: #1a1a1a;
    color: #faf9f7;
  }

  .divider { height: 1px; background: #e8e5e0; }

  .mini-player-minimal {
    background: #faf9f7;
    border-top: 1px solid #e8e5e0;
  }

  @keyframes breathe { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
  .breathe { animation: breathe 2.4s ease-in-out infinite; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-8 gap-12">
